name: tkuik-local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tkuik
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: tkuik_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tkuik -d tkuik_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
  dev:
    profiles: [dev]
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql://tkuik:local_dev_only@db:5432/tkuik_dev?schema=public
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./lib:/app/lib
      - ./public:/app/public
    command: ["sh", "-c", "npx prisma migrate deploy && npm run dev -- --hostname 0.0.0.0 --webpack"]
  app:
    profiles: [production]
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://tkuik:local_dev_only@db:5432/tkuik_dev?schema=public
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
